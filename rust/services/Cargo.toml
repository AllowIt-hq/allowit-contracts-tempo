[package]
name = "allowit-tempo-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

[package.metadata.allowit-source]
repository = "https://github.com/allowit-hq/allowit-engine"
revision = "8cbd4625b170ae72aa470a642f19a55b2f40e9a3"
path = "crates/server/crates/engine/src/tempo_transaction.rs"

[workspace]

[dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-sdk.git", rev = "67f5d696847992e18131f815ce905713ec3646e1", default-features = false, features = ["service", "transport"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
num-bigint = "0.4.6"
