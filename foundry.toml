[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
tempo = true
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/", "tempo-std/=lib/tempo-std/src/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
local = "http://127.0.0.1:8545"
moderato = "https://rpc.moderato.tempo.xyz"
