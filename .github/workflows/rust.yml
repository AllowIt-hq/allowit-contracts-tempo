name: Tempo Rust vendor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: allowit-tempo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --manifest-path rust/Cargo.toml --check
      - name: Check offline verifier
        run: cargo +1.98.0 test --manifest-path rust/Cargo.toml --locked
      - name: Check executor and recovery
        run: cargo +1.98.0 test --manifest-path rust/Cargo.toml --locked --features client
      - name: Lint vendor crate
        run: cargo +1.98.0 clippy --manifest-path rust/Cargo.toml --locked --all-targets --features client -- -D warnings
