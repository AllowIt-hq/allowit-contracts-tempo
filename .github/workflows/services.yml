name: Tempo host service protocol
on:
  pull_request:
    paths: ["rust/services/**", ".github/workflows/services.yml"]
  push:
    paths: ["rust/services/**", ".github/workflows/services.yml"]
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - run: cargo fmt --manifest-path rust/services/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/services/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/services/Cargo.toml --locked
